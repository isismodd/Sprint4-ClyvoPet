<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::page})}">
<head>
    <title th:text="${consulta.id != null ? 'Editar Consulta' : 'Nova Consulta'}">
        ClyvoPet
    </title>
</head>

<body>

<div th:fragment="page">

    <!-- Título centralizado -->
    <div class="text-center mb-3">
        <h1 class="page-title">
            <i class="fas fa-calendar-check me-2"
               style="color: var(--primary);"></i>
            <span th:text="${consulta.id != null ? '✏ Editar Consulta' : 'Nova Consulta'}">
                Nova Consulta
            </span>
        </h1>
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="${consulta.id != null}
                    ? @{/web/consultas/{id}(id=${consulta.id})}
                    : @{/web/consultas}"
                  th:object="${consulta}"
                  method="post">

                <div class="row">

                    <div class="col-md-6">
                        <div class="mb-3">

                            <label class="form-label">
                                Animal *
                            </label>

                            <select th:field="*{animalId}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Selecione um animal
                                </option>

                                <option th:each="a : ${animais}"
                                        th:value="${a.id}"
                                        th:text="${a.nome + ' - ' + a.especie}">
                                </option>

                            </select>

                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">

                            <label class="form-label">
                                Veterinário *
                            </label>

                            <select th:field="*{veterinarioId}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Selecione um veterinário
                                </option>

                                <option th:each="v : ${veterinarios}"
                                        th:value="${v.id}"
                                        th:text="${v.nome + ' - ' + v.especialidade}">
                                </option>

                            </select>

                        </div>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6">
                        <div class="mb-3">

                            <label class="form-label">
                                Data e Hora *
                            </label>

                            <input type="datetime-local"
                                   th:field="*{dataHora}"
                                   class="form-control"
                                   required>

                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select th:field="*{status}"
                                    class="form-select">

                                <option value="AGENDADA">
                                    Agendada
                                </option>

                                <option value="REALIZADA">
                                    Realizada
                                </option>

                                <option value="CANCELADA">
                                    Cancelada
                                </option>

                            </select>

                        </div>
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Motivo
                    </label>

                    <textarea th:field="*{motivo}"
                              class="form-control"
                              rows="2">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Diagnóstico
                    </label>

                    <textarea th:field="*{diagnostico}"
                              class="form-control"
                              rows="2">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Prescrição
                    </label>

                    <textarea th:field="*{prescricao}"
                              class="form-control"
                              rows="2">
                    </textarea>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Salvar
                </button>

                <a th:href="@{/web/consultas}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
