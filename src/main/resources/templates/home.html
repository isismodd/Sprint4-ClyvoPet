<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-br">

<head th:replace="~{layout/base :: head}">
    <title>Home - ClyvoPet</title>
</head>

<body>

<div th:replace="~{layout/base :: layout(~{::page})}">
    <div th:fragment="page">

        <!-- Wrapper com background -->
        <div class="home-wrapper-full">

            <div class="home-overlay"></div>

            <div class="home-content">

                <!-- Logo centralizada -->
                <div class="home-logo">
                    <img src="/images/clyvoLogo.png"
                         alt="ClyvoPet"
                         class="home-logo-img"
                         th:src="@{/images/clyvoLogo.png}">
                </div>

                <h1 class="home-title">
                    Bem-vindo ao ClyvoPet!
                </h1>

                <p class="home-subtitle">
                    Sistema de gestão de clínicas veterinárias
                </p>

                <!-- Menu hambúrguer -->
                <div class="home-menu">

                    <button class="home-menu-toggle"
                            id="menuToggle"
                            aria-label="Abrir menu">
                        <i class="fas fa-bars"></i>
                    </button>

                    <nav class="home-nav"
                         id="homeNav">

                        <!-- Animais -->
                        <a th:href="@{/web/animais}"
                           class="home-nav-item">
                            <i class="fas fa-paw"></i>
                            <span>Animais</span>
                        </a>

                        <!-- Consultas -->
                        <a th:href="@{/web/consultas}"
                           class="home-nav-item">
                            <i class="fas fa-calendar-check"></i>
                            <span>Consultas</span>
                        </a>

                        <!-- Lembretes -->
                        <a th:href="@{/web/lembretes}"
                           class="home-nav-item">
                            <i class="fas fa-bell"></i>
                            <span>Lembretes</span>
                        </a>

                        <!-- Veterinários - SOMENTE ADMIN -->
                        <a th:href="@{/web/veterinarios}"
                           class="home-nav-item"
                           sec:authorize="hasRole('ADMIN')">
                            <i class="fas fa-user-doctor"></i>
                            <span>Veterinários</span>
                        </a>

                        <!-- Novo Animal -->
                        <a th:href="@{/web/animais/novo}"
                           class="home-nav-item">
                            <i class="fas fa-plus-circle"></i>
                            <span>Novo Animal</span>
                        </a>

                        <!-- Nova Consulta -->
                        <a th:href="@{/web/consultas/nova}"
                           class="home-nav-item">
                            <i class="fas fa-plus-square"></i>
                            <span>Nova Consulta</span>
                        </a>

                        <!-- Logout -->
                        <a th:href="@{/logout}"
                           class="home-nav-item logout">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Sair</span>
                        </a>

                    </nav>

                </div>

            </div>

        </div>

        <!-- JavaScript para esconder a navbar e controlar o menu -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {

                // 1. Esconder a navbar na Home
                const navbar = document.getElementById('mainNavbar');

                if (navbar) {
                    navbar.style.display = 'none';
                }

                // 2. Ajustar o container do conteúdo
                const content = document.getElementById('mainContent');

                if (content) {
                    content.style.marginTop = '0';
                    content.style.padding = '0';
                    content.style.maxWidth = '100%';
                }

                // 3. Menu hambúrguer
                const toggle = document.getElementById('menuToggle');
                const nav = document.getElementById('homeNav');

                if (toggle && nav) {

                    toggle.addEventListener('click', function() {

                        nav.classList.toggle('open');

                        const icon = toggle.querySelector('i');

                        if (nav.classList.contains('open')) {
                            icon.className = 'fas fa-times';
                        } else {
                            icon.className = 'fas fa-bars';
                        }
                    });

                    document
                        .querySelectorAll('.home-nav-item')
                        .forEach(function(link) {

                            link.addEventListener('click', function() {

                                nav.classList.remove('open');

                                toggle.querySelector('i').className =
                                    'fas fa-bars';
                            });

                        });
                }

            });
        </script>

    </div>
</div>

</body>
</html>
