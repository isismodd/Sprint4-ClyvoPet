<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClyvoPet</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon"
          type="image/png"
          th:href="@{/images/favicon.png}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1a3a;
            padding: 1rem;
        }

        .login-card {
            max-width: 900px;
            width: 100%;
            min-height: 520px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        /* LADO ESQUERDO - IMAGEM */
        .login-image {
            flex: 1.2;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            overflow: hidden;
            min-height: 100%;
        }
        .login-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.2));
        }
        .login-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 26, 58, 0.2);
            z-index: 1;
        }

        /* LADO DIREITO - FORMULÁRIO */
        .login-form {
            flex: 1;
            padding: 2.5rem 2rem;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* LOGO NO FORMULÁRIO */
        .login-form .login-logo {
            display: block;
            max-width: 120px;
            height: auto;
            margin: 0 auto 1.5rem auto;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
        }

        .login-form .form-header {
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .login-form .form-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 0.25rem 0;
        }
        .login-form .form-header p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 0;
        }
        .login-form .form-group {
            margin-bottom: 1rem;
        }
        .login-form label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 0.25rem;
        }
        .login-form .input-group {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .login-form .input-group:focus-within {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
        }
        .login-form .input-group-text {
            background: #f8fafc;
            border: none;
            color: #94a3b8;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }
        .login-form .form-control {
            border: none;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            background: white;
            outline: none;
            box-shadow: none;
        }
        .login-form .form-control:focus {
            box-shadow: none;
            border: none;
        }
        .login-form .btn-login {
            width: 100%;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .login-form .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 138, 0.3);
        }
        .login-form .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .login-form .btn-login i {
            margin-right: 8px;
        }
        .login-form .forgot-link {
            text-align: right;
            margin: -0.25rem 0 0.75rem;
            font-size: 0.8rem;
        }
        .login-form .forgot-link a {
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
        }
        .login-form .forgot-link a:hover {
            text-decoration: underline;
        }
        .login-form .register-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        .login-form .register-link a {
            color: #1e3a8a;
            font-weight: 600;
            text-decoration: none;
        }
        .login-form .register-link a:hover {
            text-decoration: underline;
        }
        .login-form .alert-custom {
            border-radius: 10px;
            padding: 0.6rem 1rem;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .login-form .alert-custom i {
            font-size: 1rem;
        }
        .login-form .alert-danger-custom {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .login-form .alert-success-custom {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .login-card {
                flex-direction: column;
                min-height: auto;
                max-width: 420px;
            }
            .login-image {
                min-height: 220px;
                flex: none;
                height: 220px;
            }
            .login-image img {
                object-fit: cover;
                height: 100%;
                width: 100%;
            }
            .login-form {
                padding: 1.5rem;
            }
            .login-form .form-header h1 {
                font-size: 1.3rem;
            }
            .login-form .login-logo {
                max-width: 90px;
                margin-bottom: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            .login-card {
                border-radius: 16px;
            }
            .login-image {
                min-height: 160px;
                height: 160px;
            }
            .login-form {
                padding: 1.25rem;
            }
            .login-form .form-header h1 {
                font-size: 1.1rem;
            }
            .login-form .form-header p {
                font-size: 0.8rem;
            }
            .login-form .login-logo {
                max-width: 70px;
                margin-bottom: 0.75rem;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- Lado Esquerdo - Imagem do Gato -->
    <div class="login-image">
        <img src="https://blog.cobasi.com.br/wp-content/uploads/2020/06/cuidar-de-gato-capa.png" alt="Gato ClyvoPet">
    </div>

    <!-- Lado Direito - Formulário -->
    <div class="login-form">
        <!-- LOGO ACIMA DO TÍTULO -->
        <img src="/images/clyvoLogo.png"
             alt="ClyvoPet"
             class="login-logo"
             onerror="this.style.display='none'">

        <div class="form-header">
            <h1>Bem-vindo de volta</h1>
            <p>Faça login para acessar o sistema</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Digite seu e-mail" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Digite sua senha" required>
                </div>
            </div>

            <div class="forgot-link">
                <a href="/esqueci-senha">Esqueceu a senha?</a>
            </div>

            <div th:if="${param.error}" class="alert-custom alert-danger-custom">
                <i class="fas fa-exclamation-circle"></i> E-mail ou senha inválidos
            </div>
            <div th:if="${param.logout}" class="alert-custom alert-success-custom">
                <i class="fas fa-check-circle"></i> Você foi desconectado
            </div>
            <div th:if="${param.sucesso}" class="alert-custom alert-success-custom">
                <i class="fas fa-check-circle"></i> Cadastro realizado com sucesso!
            </div>
            <div th:if="${param.senhaAlterada}" class="alert-custom alert-success-custom">
                <i class="fas fa-check-circle"></i> Senha alterada com sucesso! Faça login.
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>

        <div class="register-link">
            Não tem conta? <a href="/registrar">Cadastre-se</a>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
